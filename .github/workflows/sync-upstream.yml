name: Sync upstream

on:
  schedule:
    - cron: '*/15 * * * *'   # 每15分钟检查一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream, keep dock.py patched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch upstream master

          if git merge upstream/master --no-edit; then
            echo "官方无改动或无冲突，直接合并"
          else
            echo "dock.py 冲突：取官方新版并重打补丁"
            git checkout upstream/master -- module/retire/dock.py
            git apply --3way .github/patches/dock.patch
            git add module/retire/dock.py
            git commit --no-edit
          fi

          git push origin master
